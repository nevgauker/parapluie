# Parapluie relay. Deploy with `npm run deploy` from this folder (needs a
# Cloudflare account and `npx wrangler login` once). See README.md here.
name = "parapluie-relay"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# SQLite-backed durable objects are the ones available on the free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[vars]
# Comma-separated origins allowed to connect, e.g. "https://parapluie.example".
# Leave empty to allow any (fine for testing; set it for production).
ALLOWED_ORIGINS = "https://parapluie-five.vercel.app,https://parapluie.rotemnev.com,http://parapluie.rotemnev.com,http://localhost:3000"
